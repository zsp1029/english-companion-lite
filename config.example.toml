# 首次启动安全默认值。实际文件：%LOCALAPPDATA%\EnglishCompanionLite\config.toml
enabled = false
allow_notepad = false
allow_network = false
mock_mode = false

# MyMemory 免费，免注册/绑卡/Key；也可选 'azure'，不会自动切换到其他服务。
provider = 'mymemory'
# 可留空。填写有效联系邮箱会将邮箱发送到 MyMemory，用于提高免费额度。
mymemory_email = ''

# 只接受绝对路径；不要使用窗口标题或仅 EXE 文件名。
# 白名单授权整个应用进程中的可编辑控件；无法识别未标记密码的业务敏感字段。
allowed_executables = []
# allowed_executables = ['C:\Program Files\Example\Example.exe']

punctuation_delay_ms = 300 # 范围 200–5000
idle_delay_ms = 1500      # 范围 500–15000
display_ms = 4000        # 范围 500–30000
min_han = 6              # 范围 1–300

# 以下仅用于 Azure；MyMemory 始终使用固定的官方 HTTPS 接口。
# 全球/区域端点填主机根地址；自定义资源自动补 /translator/text/v3.0。
endpoint = 'https://api.cognitive.microsofttranslator.com'
# Key 和 Region 只通过 AZURE_TRANSLATOR_KEY / AZURE_TRANSLATOR_REGION 环境变量提供。
